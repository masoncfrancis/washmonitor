services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: washmonitor-api
    ports:
      - "8001:8001"
    environment:
      - API_ENV=production
      - SENTRY_DSN=https://your_sentry_project_dsn_here
    volumes:
      - ./config:/config:ro
    restart: unless-stopped

  # agent-dryer:
  #   build:
  #     context: ./agent-dryer
  #     dockerfile: Dockerfile
  #   container_name: washmonitor-agent-dryer
  #   ports:
  #     - "8005:8005"
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   volumes:
  #     - ./config:/config:ro
  #   environment:
  #     - API_SERVER_URL=http://api:8001
  #     - SEND_SMS_URL=https://your_sms_webhook_url
  #     - SMS_USER=your_sms_username
  #     - SMS_PASSWORD=your_sms_password
  #     - SENTRY_DSN=https://your_sentry_project_dsn_here

  agent-washer:
    build:
      context: ./agent-washer
      dockerfile: Dockerfile
    container_name: washmonitor-agent-washer
    volumes:
      - ./config:/config:ro
    environment:
      - API_URL=http://api:8001
      - WASHER_CAMERA_URL=http://your_camera_url
      - DISCORD_URL=https://your_discord_webhook_url
      - SEND_SMS_URL=https://your_sms_webhook_url
      - SMS_USER=your_sms_username
      - SMS_PASSWORD=your_sms_password
      - SENTRY_DSN=https://your_sentry_project_dsn_here
    depends_on:
      - api
    restart: unless-stopped

  worker-shelly:
    build:
      context: ./worker-shelly
      dockerfile: Dockerfile
    container_name: washmonitor-worker-shelly
    volumes:
      - ./config:/config:ro
    environment:
      - APPLIANCE_ROLE=washer
      - API_SERVER_URL=http://api:8001
      - SHELLY_URL=http://your_shelly_device_ip
      - SHELLY_USERNAME=
      - SHELLY_PASSWORD=
      - CURRENT_ACTIVE_THRESHOLD_A=0.5
      - CURRENT_INACTIVE_THRESHOLD_A=0.1
      - CURRENT_INACTIVE_DURATION_SECONDS=300
      - SHELLY_POLL_INTERVAL_SECONDS=5
      - HTTP_TIMEOUT_SECONDS=10
      - SEND_SMS_URL=https://your_sms_webhook_url
      - SMS_USER=your_sms_username
      - SMS_PASSWORD=your_sms_password
      - SENTRY_DSN= # https://your_sentry_project_dsn_here
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: washmonitor-dashboard
    ports:
      - "3000:8080"
    depends_on:
      - api
    environment:
      - VITE_SENTRY_DSN=https://your_glitchtip_project_dsn_here
    restart: unless-stopped
