[project]
name = "agent-washer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "masoncfrancis@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pillow==12.*",
    "python-dotenv~=1.2.2",
    "sentry-sdk>=2.68.1",
    "ultralytics>=8.4.14",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

